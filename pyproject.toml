[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/jma"]

[tool.coverage.report]
show_missing = true
# Total gate: pytest-cov fails the run below this (ci: tests.yml "Run the tests with the total coverage gate").
fail_under = 95
# Two decimals so 94.6 % is not rounded up to 95 % and let through.
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage-threshold]
# Per-module gate: coverage-threshold fails when any file in coverage.json is below this
# (ci: tests.yml "Per-module coverage gate").
file_line_coverage_min = 95
# The tool also checks the total and defaults it to 100 % when unset; keep this equal to fail_under above.
line_coverage_min = 95

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the Japanese test strings and URLs are long by nature.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
# Checked against the Home Assistant that requirements_test.txt installs (2026.10.2): its signatures take probatio
# schemas, while 2026.9 still typed them as voluptuous, so mypy is green on 2026.10 only. The code runs on both.
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["custom_components/jma"]
plugins = []
# Every third-party import (homeassistant, aiohttp, PIL, probatio) ships its own types. The one override: Home
# Assistant 2026.10.2's binary_sensor package imports BinarySensorDeviceClass from its const module without an
# __all__ (dev has one since October 2026), and strict mode would refuse the re-export; 2026.9 defines it in place.

[[tool.mypy.overrides]]
module = "homeassistant.components.binary_sensor"
implicit_reexport = true
