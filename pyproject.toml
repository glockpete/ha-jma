[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the Japanese test strings and URLs are long by nature.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
