[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the Japanese test strings and URLs are long by nature.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["custom_components/jma"]
plugins = []
# No [[tool.mypy.overrides]]: every third-party import (homeassistant, aiohttp, PIL, voluptuous) ships its own types.
