name: Release

# Attaches jma.zip, the integration folder zipped, to every published release. hacs.json names that asset
# (zip_release + filename), so HACS and the Home Assistant Marketplace download one file instead of every file
# of the folder, and count its downloads. Borrowed from HACS's own .github/workflows/publish.yml.
# GitHub runs this only once the release is public, so if any step fails the release goes back to draft: HACS
# would otherwise offer a version it can't download.
# Run it by hand (workflow_dispatch, with the tag) to add the asset to an older release. That run only uploads:
# it fails when the tag has no release, and it never creates or publishes one.
# Both the upload and the draft step edit a release that is already published, so the repository must not turn on
# immutable releases (a repository setting).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to attach the asset to, for example v0.7.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  asset:
    name: Attach the asset to the release
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # HACS and the Marketplace compare the two
      - name: The manifest version must equal the tag
        run: |
          version="$(jq -r .version custom_components/jma/manifest.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "manifest.json says $version but the tag is $TAG" >&2
            exit 1
          fi
      # manifest.json sits at the root of the archive: the Marketplace extracts it into custom_components/jma
      - name: Zip the integration folder
        run: |
          cd custom_components/jma
          zip -r ../../jma.zip . -x '*/__pycache__/*' '*.pyc'
          unzip -l ../../jma.zip
      # gh release upload fails when the tag has no release, so a manual run can't create one. --clobber replaces
      # the asset (new asset id), so a rerun on an old release resets that release's download count.
      - name: Upload the asset to the release
        run: gh release upload "$TAG" jma.zip --clobber
      - name: Put the release back to draft so HACS doesn't offer it without its asset
        if: failure() && github.event_name == 'release'
        run: gh release edit "$TAG" --draft=true
