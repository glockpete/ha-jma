name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the test dependencies
        run: pip install -r requirements_test.txt
      # Gate 1 - TOTAL: pytest-cov fails the run when total coverage of custom_components/jma
      # drops below fail_under (95 %, set in pyproject.toml [tool.coverage.report]).
      - name: Run the tests with the total coverage gate
        run: pytest tests -q --cov --cov-report=term-missing --cov-report=json
      # Gate 2 - PER MODULE: coverage-threshold reads coverage.json and fails when ANY file under
      # custom_components/jma is below file_line_coverage_min (95 %, set in pyproject.toml
      # [tool.coverage-threshold]); it lists every offending file.
      - name: Per-module coverage gate
        run: coverage-threshold

  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89"  # v4.1.0
        with:
          version: "0.6.8"
          args: "check"
